name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Test Maven reactor
        run: mvn --batch-mode clean verify

      - name: Build gateway image
        run: docker build --file gateway/Dockerfile --tag ai-inference-gateway:ci .

      - name: Build mock inference image
        run: docker build --file mock-inference/Dockerfile --tag mock-inference:ci .
